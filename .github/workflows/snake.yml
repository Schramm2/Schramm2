name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Schramm2
          outputs: |
            dist/github-snake.svg?color_snake=%23171717&color_dots=%23eeeeee,%23d4d4d4,%23a3a3a3,%23737373,%23404040
            dist/github-snake-dark.svg?color_snake=%23ededed&color_dots=%23262626,%23404040,%23737373,%23a3a3a3,%23ededed

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
